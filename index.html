<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat Box - 原型</title>
<style>
:root { --gold: hsla(31, 84%, 83%, 1); --bg: #1a1a1a; --bg-card: #242424; --text: #e0d6c8; --text-secondary: #9a8e7e; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; background: #0d0d0d; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.box { background: var(--bg-card); border: 1px solid #3a3530; border-radius: 18px; padding: 40px; text-align: center; max-width: 340px; }
.box .icon { font-size: 48px; margin-bottom: 16px; }
.box .title { font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
.box .desc { font-size: 13px; color: var(--text-secondary); margin-bottom: 24px; }
.box .btn { display: inline-block; padding: 12px 32px; border-radius: 12px; background: var(--gold); color: #1a1a1a; text-decoration: none; font-size: 14px; font-weight: 600; transition: all 0.2s; }
.box .btn:hover { background: hsla(31, 70%, 60%, 1); }
</style>
</head>
<body>
<div class="box">
  <div class="icon">🤖</div>
  <div class="title">AI Chat Box</div>
  <div class="desc">卡车助手原型 MVP1</div>
  <a class="btn" href="truck-assistant-prototype%20W52.html">进入原型</a>
</div>
</body>
</html>
